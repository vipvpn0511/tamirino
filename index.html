<style>

.r3{display:grid;grid-template-columns:1fr 1.5fr 1.1fr;gap:6px}.pcs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.pc{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:16px;padding:7px 12px;font:inherit;font-size:13px}.pc.on{background:var(--ac);border-color:var(--ac);color:#fff}
#wl{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 60% at 50% 0,var(--bg2),var(--bg) 70%);padding:calc(30px + env(safe-area-inset-top)) 24px 30px;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:auto}#wl .wi{width:140px;height:140px;margin:0 auto 18px;border-radius:32px}#wl p,#wl li{color:var(--mu)}#wl ul{text-align:right;padding-inline-start:20px}#wl label{display:block;text-align:right}.dts{display:flex;justify-content:center;gap:6px;margin:14px}.dts i{width:8px;height:8px;border-radius:4px;background:var(--bd)}.dts i.on{width:22px;background:var(--ac)}
.hi{flex:1;min-height:0;background:url(welcome.jpg) top center/100% auto no-repeat;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
#wl.w1{padding:0;justify-content:space-between;background:radial-gradient(90% 50% at 50% 30%,#16408f 0%,#081a40 55%,#040b1f 100%)}.w1 svg{width:100%;flex:1;min-height:0;margin-top:env(safe-area-inset-top)}.w1 .pn{margin:0 16px calc(18px + env(safe-area-inset-bottom));padding:22px 20px;border-radius:32px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.w1 h1{font-size:27px;margin:0 0 6px;color:#fff;line-height:1.5}.w1 .tg{color:#9db8e8;font-size:14px;margin-top:12px}.w1 .btn{background:linear-gradient(135deg,#1d6bff,#38a5ff);box-shadow:0 8px 24px rgba(42,123,255,.5);font-size:18px;padding:16px;margin-top:14px}
@keyframes bob{50%{transform:translateY(-6px)}}#rb{animation:bob 3.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){#rb{animation:none}}
.pvs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.pvs img{width:84px;height:84px;object-fit:cover;border-radius:14px;border:1px solid var(--bd)}.pvs span{position:relative}.pvs button{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;border:0;background:#000a;color:#fff}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;z-index:20;display:none}
</style></head><body>
<main id="app"></main>
<nav class="nav"><button data-v="home" onclick="G('home')"><span>⌂</span>خانه</button><button data-v="cust" onclick="G('cust')"><span>☺</span>مشتری‌ها</button><button class="fab" onclick="E(0)">+</button><button data-v="rep" onclick="G('rep')"><span>▥</span>گزارش‌ها</button><button data-v="set" onclick="G('set')"><span>⚙</span>تنظیمات</button></nav>
<div class="bk" id="bk" onclick="X()"></div><div class="sheet" id="sh"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='mobaile_ali_v1';
const WN=['در صورت آب‌خوردگی دستگاه، فروشگاه مسئولیتی در قبال خرابی‌های بعدی ندارد.','فروشگاه بیشتر از یک ماه تعهدی برای نگهداری تلفن شما ندارد.','با توجه به نوسانات بازار، تحویل دیرهنگام تلفن همراه به نرخ روز قطعات حساب می‌گردد.','پس از تعویض نمایشگر، تست LCD هنگام تحویل باید با حضور مشتری انجام شود.','ضربه یا دستکاری دستگاه توسط دیگران، گارانتی تعمیر را باطل می‌کند.'];
const dv=c=>[c.brand,c.dev].filter(Boolean).join(' ');
let D=Object.assign({c:[],n:1001,bk:Date.now(),hide:0,light:0,shop:{n:'',a:'',p:''},warn:WN.join('\n'),thx:'با تشکر از اعتماد شما 🌹',logo:'',onb:0,nf:0,tg:{t:'',c:'',on:0,last:0}},JSON.parse(localStorage.getItem(K)||'null')),V='home',F='all',Q='',dp;
const save=()=>localStorage.setItem(K,JSON.stringify(D)),fa=n=>(+n||0).toLocaleString('fa-IR'),M=n=>D.hide?'•••••':fa(n)+' تومان';
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const num=v=>+String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬\s]/g,'')||0;
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date()),add=n=>iso(new Date(Date.now()+n*864e5));
const jd=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'}):'—';
const dif=s=>Math.round((new Date(s)-new Date(today()))/864e5),SN={rep:'در حال تعمیر',rdy:'آماده تحویل',del:'تحویل شده'},SC={rep:'var(--yl)',rdy:'var(--gr)',del:'var(--mu)'};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};
const late=c=>c.st!='del'&&c.due&&c.due<today();
function stats(){const t=today(),m=t.slice(0,7),o={rep:0,rdy:0,late:0,debt:0,bal:0,rev:0,part:0};
D.c.forEach(c=>{c.st=='rep'&&o.rep++;c.st=='rdy'&&o.rdy++;late(c)&&o.late++;const b=c.price-c.dep;if(b>0){o.debt++;o.bal+=b}if(c.st=='del'&&(c.dd||'').slice(0,7)==m){o.rev+=c.price;o.part+=c.part}});o.prof=o.rev-o.part;return o}
function notes(){const s=stats(),n=[],d=Math.floor((Date.now()-D.bk)/864e5);
if(d>=7)n.push('⚠ '+fa(d)+' روز از آخرین پشتیبان‌گیری گذشته؛ از تنظیمات نسخه پشتیبان بگیر.');
D.c.filter(c=>c.st!='del'&&c.due&&dif(c.due)>=0&&dif(c.due)<=1).forEach(c=>n.push('⏰ تحویل '+esc(c.name)+' '+(dif(c.due)?'فردا':'امروز')+' است.'));
if(s.late)n.push('🔴 '+fa(s.late)+' دستگاه دیرکرد دارد.');if(s.rdy)n.push('🟢 '+fa(s.rdy)+' دستگاه آماده تحویل است.');if(s.debt)n.push('💰 '+fa(s.debt)+' مشتری مانده حساب دارند (جمع '+fa(s.bal)+' تومان).');return n}
const G=v=>{V=v;R();scrollTo(0,0)};
function R(){document.documentElement.dataset.t=D.light?'light':'';$('#app').innerHTML=({home:H,cust:C,rep:P,set:S})[V]();document.querySelectorAll('.nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==V))}
function H(){const s=stats(),n=notes().length,up=D.c.filter(c=>c.st!='del').sort((a,b)=>(a.due||'z')<(b.due||'z')?-1:1).slice(0,5),mn=new Date().toLocaleDateString('fa-IR',{month:'long',year:'numeric'});
const T=(i,t,e,f)=>`<button class="tile" onclick="${f}"><span>${i}</span>${t}<em>${e}</em></button>`;
return `<div class="hd"><img src="${D.logo||'icon-192.png'}"><div><h1>${esc(D.shop.n)||'مدیریت تعمیرات'}</h1><small>${new Date().toLocaleDateString('fa-IR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small></div><div class="sp"></div><button class="ib" onclick="D.light=!D.light;save();R()">◐</button><button class="ib" onclick="D.hide=!D.hide;save();R()">${D.hide?'🙈':'👁'}</button><button class="ib" onclick="BL()">🔔${n?'<i>'+fa(n)+'</i>':''}</button></div>
<div class="hero"><div class="r"><span>درآمد تحویل‌شده این ماه</span><span class="chip">${mn}</span></div><div class="big">${D.hide?'•••••':fa(s.rev)} <small>تومان</small></div><span class="pill">مانده حساب مشتری‌ها: ${M(s.bal)}</span>
<div class="st"><div><b>${fa(s.rep)}</b>در حال تعمیر</div><div><b>${fa(s.rdy)}</b>آماده تحویل</div><div><b>${fa(s.late)}</b>دیرکرد</div></div></div>
<div class="g">${T('➕','ثبت مشتری','جدید','E(0)')}${T('👥','مشتری‌ها',fa(D.c.length)+' مورد',"F='all';G('cust')")}${T('⏱','دیرکرد',fa(s.late)+' مورد',"F='late';G('cust')")}${T('✅','آماده تحویل',fa(s.rdy)+' مورد',"F='rdy';G('cust')")}${T('💳','مانده‌ها',fa(s.debt)+' مورد',"F='debt';G('cust')")}${T('📊','گزارش سود','ماهانه',"G('rep')")}${T('🔍','جستجو','نام و شماره',"F='all';G('cust');$('#q').focus()")}${T('💾','پشتیبان',fa(Math.floor((Date.now()-D.bk)/864e5))+' روز پیش','BU()')}</div>
<h2>تحویل‌های نزدیک</h2>${up.map(c=>`<div class="it" onclick="O(${c.id})"><div style="flex:1"><b>#${c.id} ${esc(c.name)}</b><br><small>${esc(dv(c))} - تحویل ${jd(c.due)}</small></div>${late(c)?`<span class="tag late">${fa(-dif(c.due))} روز دیرکرد</span>`:`<span class="tag ${c.st=='rdy'?'ok':'wt'}">${c.due?fa(dif(c.due))+' روز مانده':SN[c.st]}</span>`}</div>`).join('')||'<p style="color:var(--mu)">هنوز دستگاهی ثبت نشده. با دکمه + اولین مشتری را ثبت کن.</p>'}`}
function C(){const f=[['all','همه'],['rep','در حال تعمیر'],['rdy','آماده تحویل'],['late','دیرکرد'],['debt','مانده‌دار'],['del','تحویل‌شده']],q=Q.trim().toLowerCase();
const l=D.c.filter(c=>(F=='all'||(F=='late'?late(c):F=='debt'?c.price>c.dep:c.st==F))&&(!q||[c.name,c.phone,dv(c),c.id].join(' ').toLowerCase().includes(q))).reverse();
return `<h2>مشتری‌ها</h2><input id="q" placeholder="جستجوی نام، شماره یا کد" value="${esc(Q)}" oninput="Q=this.value;L()"><div class="ch">${f.map(x=>`<button class="${F==x[0]?'on':''}" onclick="F='${x[0]}';R()">${x[1]}</button>`).join('')}</div><div id="ls">${LI(l)}</div>`}
const LI=l=>l.map(c=>`<div class="it" onclick="O(${c.id})"><span class="dot" style="background:${SC[c.st]}"></span><b>${esc(c.name)}</b><small>#${c.id}</small></div>`).join('')||'<p style="color:var(--mu)">موردی پیدا نشد.</p>';
function L(){const q=Q.trim().toLowerCase();$('#ls').innerHTML=LI(D.c.filter(c=>(F=='all'||(F=='late'?late(c):F=='debt'?c.price>c.dep:c.st==F))&&(!q||[c.name,c.phone,dv(c),c.id].join(' ').toLowerCase().includes(q))).reverse())}
function P(){const s=stats(),ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(15);d.setMonth(d.getMonth()-i);ms.push([iso(d).slice(0,7),d.toLocaleDateString('fa-IR',{month:'short'})])}
const a=ms.map(m=>{let r=0,p=0;D.c.forEach(c=>{if(c.st=='del'&&(c.dd||'').slice(0,7)==m[0]){r+=c.price;p+=c.price-c.part}});return[m[1],r,p]}),mx=Math.max(1,...a.map(x=>x[1]));
return `<h2>گزارش سود</h2><div class="glass" style="border-radius:22px;padding:14px;margin-bottom:12px"><div class="kv"><span>درآمد این ماه</span><b>${M(s.rev)}</b></div><div class="kv"><span>هزینه قطعه‌ها</span><b>${M(s.part)}</b></div><div class="kv" style="border:0"><span>سود خالص</span><b style="color:var(--gr)">${M(s.prof)}</b></div></div>
<div class="glass" style="border-radius:22px;padding:14px"><small style="color:var(--mu)">شش ماه اخیر: آبی درآمد، سبز سود</small><div class="bars">${a.map(x=>`<div><div style="flex-direction:row;align-items:flex-end;gap:3px"><i style="height:${x[1]/mx*100}%"></i><i class="p" style="height:${Math.max(0,x[2])/mx*100}%"></i></div>${x[0]}</div>`).join('')}</div></div>
<h2 style="margin-top:16px">مانده حساب‌ها</h2>${D.c.filter(c=>c.price>c.dep).map(c=>`<div class="it" onclick="O(${c.id})"><b>${esc(c.name)}</b><span class="tag late">${M(c.price-c.dep)}</span></div>`).join('')||'<p style="color:var(--mu)">مانده‌ای وجود ندارد.</p>'}`}
